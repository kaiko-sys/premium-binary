<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Binary - Live</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0b0e14; color: #fff; text-align: center; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #121824; }
    .balance-box { background: #1a2235; padding: 8px 15px; border-radius: 20px; font-weight: bold; color: #2563eb; }
    
    .auth-buttons { display: flex; gap: 10px; }
    .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-login { background: transparent; color: #8a99ad; }
    .btn-register { background: #2563eb; color: #fff; }

    /* Chart Section */
    .chart-container { width: 90%; max-width: 600px; margin: 20px auto; height: 300px; }
    
    /* Trade Section */
    .trade-container { margin: 20px auto; width: 90%; max-width: 400px; padding: 20px; background: #0f172a; border-radius: 10px; }
    .price-display { font-size: 24px; color: #22c55e; margin: 10px 0; }
    
    .input-group { margin-bottom: 15px; text-align: left; }
    label { font-size: 12px; color: #8a99ad; display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 10px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 5px; }

    .trade-actions { display: flex; gap: 10px; margin-top: 20px; }
    .trade-btn { flex: 1; padding: 15px; font-size: 18px; }
    .btn-rise { background: #16a34a; color: white; }
    .btn-fall { background: #dc2626; color: white; }

    /* Modal Styling */
    .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
    .modal-content { background: #121824; width: 90%; max-width: 400px; margin: 100px auto; padding: 20px; border-radius: 10px; position: relative; }
    .close { position: absolute; right: 15px; top: 10px; color: #8a99ad; cursor: pointer; font-size: 20px; }
  </style>
</head>
<body>

  <header>
    <h1>Premium Binary.pro</h1>
    <div id="authContainer" class="auth-buttons">
      <button class="btn btn-login" onclick="openModal('loginModal')">Log In</button>
      <button class="btn btn-register" onclick="openModal('registerModal')">Register</button>
    </div>
    <div id="userContainer" style="display: none;">
      <span class="balance-box" id="balanceDisplay">$0.00</span>
    </div>
  </header>

  <div class="chart-container">
    <canvas id="liveChart"></canvas>
  </div>

  <div class="trade-container">
    <h3>Volatility 10 (1s)</h3>
    <div class="price-display" id="priceDisplay">9365.26</div>
    
    <div class="input-group">
      <label>Stake (USD)</label>
      <input type="number" id="stakeAmount" value="10" min="1">
    </div>

    <div class="trade-actions">
      <button class="btn trade-btn btn-rise" onclick="placeTrade('RISE')">Rise</button>
      <button class="btn trade-btn btn-fall" onclick="placeTrade('FALL')">Fall</button>
    </div>
  </div>

  <!-- Register Modal -->
  <div id="registerModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModals()">&times;</span>
      <h2>Register</h2><br>
      <form id="registerForm">
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="regEmail" required>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="regPassword" required>
        </div>
        <button type="submit" class="btn btn-register" style="width:100%">Create Account</button>
      </form>
      <p id="regMessage" style="margin-top:10px; color:red;"></p>
    </div>
  </div>

  <script>
    // 1. Chart.js Live Feed Setup
    const ctx = document.getElementById('liveChart').getContext('2d');
    const priceData = [9365.26, 9366, 9364, 9367, 9365, 9368, 9366];
    const labels = priceData.map((_, i) => i + 1);

    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          data: priceData,
          borderColor: '#ffffff',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: '#1e2638' }, ticks: { display: false } },
          y: { position: 'right', grid: { color: '#1e2638' }, ticks: { color: '#8a99ad' } }
        }
      }
    });

    // 2. Fetch Live Price from Backend
    const priceDisplay = document.getElementById('priceDisplay');
    
    async function updateLivePrice() {
      try {
        const response = await fetch('/api/price');
        const data = await response.json();
        const newPrice = data.price;
        
        // Update Chart
        chart.data.labels.push(chart.data.labels.length + 1);
        chart.data.datasets[0].data.push(newPrice);
        if (chart.data.datasets[0].data.length > 30) {
          chart.data.labels.shift();
          chart.data.datasets[0].data.shift();
        }
        chart.update('none'); // Update smoothly without full animation
        
        // Update Display
        priceDisplay.textContent = newPrice.toFixed(2);
      } catch (err) { console.error("Price fetch error:", err); }
    }
    setInterval(updateLivePrice, 2000); // Sync with backend

    // 3. Trading & Auth Logic
    function placeTrade(type) {
      const stake = document.getElementById('stakeAmount').value;
      const current = priceDisplay.textContent;
      alert(`${type} Trade Placed!\nStake: $${stake}\nEntered at: ${current}\nContract Duration: 5 Ticks`);
    }

    // Modal Control
    function openModal(id) { document.getElementById(id).style.display = "block"; }
    function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = "none"); }
    window.onclick = function(e) { if (e.target.className === 'modal') closeModals(); }

    // Registration Form Handler
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const msg = document.getElementById('regMessage');
      
      msg.textContent = "Processing...";
      msg.style.color = "white";

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json();

        if (data.success) {
          msg.textContent = "Success! You are registered.";
          msg.style.color = "green";
          // Log them in UI automatically
          document.getElementById('authContainer').style.display = "none";
          document.getElementById('userContainer').style.display = "flex";
          document.getElementById('balanceDisplay').textContent = `$${data.user.balance}`;
          setTimeout(closeModals, 1500);
        } else {
          msg.textContent = data.message;
          msg.style.color = "red";
        }
      } catch (err) { msg.textContent = "Connection failed."; }
    });
  </script>
</body>
</html>
